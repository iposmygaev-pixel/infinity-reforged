plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle'
}

group = 'com.infinityreforged'
version = '0.5.0'

base {
    archivesName = 'ModernCombat-1.7.10'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion = '1.7.10'
    username = 'Developer'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

repositories {
    maven {
        name = 'GTNH Maven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
        mavenContent { includeGroup('com.github.GTNewHorizons') }
    }
}

dependencies {
    // Optional: AppleCore's hunger API, used only when AppleCore is installed.
    compileOnly('com.github.GTNewHorizons:AppleCore:3.4.0:api') { transitive = false }
}
