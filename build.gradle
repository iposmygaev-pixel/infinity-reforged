import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

// Subprojects (the mods) must be configured before the install tasks look at them.
evaluationDependsOnChildren()

// ---------------------------------------------------------------------------------------------
// Settings. Priority: -Pname=value on the command line > local.properties > default.
//
//   instanceDir   modpack instance (folder that contains "mods")
//                 default: <home>/curseforge/minecraft/Instances/FTB Infinity Evolved
//   serverDir     optional: a server folder to install the mods into as well
//   minecraftDir  folder with a modern vanilla Minecraft (versions/, assets/) for the sound pack
//                 default: official launcher .minecraft, then <home>/curseforge/minecraft/Install
//   texturePacks  false to skip downloading the Modernity texture packs
//   shaders       false to skip installing the shader pack
//   assetsVersion optional: which modern version to take sounds/sprites from (default: newest)
// ---------------------------------------------------------------------------------------------
def localProps = new Properties()
def localFile = file('local.properties')
if (localFile.exists()) localFile.withReader('UTF-8') { localProps.load(it) }

def setting = { String name, String fallback ->
    def value = findProperty(name) ?: localProps.getProperty(name)
    value = value?.toString()?.trim()
    return value ? value : fallback
}

def home = System.getProperty('user.home')
def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def defaultMinecraftDir = os.contains('win') ? "${System.getenv('APPDATA')}/.minecraft"
    : os.contains('mac') ? "${home}/Library/Application Support/minecraft" : "${home}/.minecraft"

def instanceDir = file(setting('instanceDir', "${home}/curseforge/minecraft/Instances/FTB Infinity Evolved"))
def serverDirSetting = setting('serverDir', null)
def minecraftDirSetting = setting('minecraftDir', null)
def assetsVersion = setting('assetsVersion', null)

def modProjects = subprojects.findAll { it.plugins.hasPlugin('com.gtnewhorizons.retrofuturagradle') }

/** The release (reobfuscated) jar of a mod project. */
def releaseJar = { Project p ->
    p.layout.buildDirectory.file("libs/${p.base.archivesName.get()}-${p.version}.jar").get().asFile
}

def installInto = { File target ->
    def mods = new File(target, 'mods')
    if (!mods.isDirectory()) {
        throw new GradleException("No 'mods' folder in ${target}. Set instanceDir/serverDir in local.properties.")
    }
    modProjects.each { p ->
        def prefix = "${p.base.archivesName.get()}-"
        // Remove every older version of this mod so only one copy stays in the pack.
        mods.listFiles().findAll { it.name.startsWith(prefix) && it.name.endsWith('.jar') }.each {
            it.delete()
            logger.lifecycle("  removed ${it.name}")
        }
        def jar = releaseJar(p)
        def dest = new File(mods, jar.name)
        dest.bytes = jar.bytes
        logger.lifecycle("  installed ${jar.name}")
    }
}

tasks.register('installMods') {
    group = 'infinity reforged'
    description = 'Builds all mods and copies them into the modpack instance (and serverDir, if set).'
    dependsOn modProjects.collect { "${it.path}:assemble" }
    doLast {
        logger.lifecycle("Instance: ${instanceDir}")
        installInto(instanceDir)
        if (serverDirSetting) {
            logger.lifecycle("Server: ${serverDirSetting}")
            installInto(file(serverDirSetting))
        }
    }
}

/** Version-like folder names compared numerically: 1.21.10 > 1.21.9. */
def versionKey = { String v -> v.tokenize('.').collect { it as int } }
def compareVersions = { List a, List b ->
    for (int i = 0; i < Math.max(a.size(), b.size()); i++) {
        int x = i < a.size() ? a[i] : 0
        int y = i < b.size() ? b[i] : 0
        if (x != y) return x <=> y
    }
    return 0
}

// Texture packs downloaded from Modrinth (sha1-verified). Later entries override earlier ones.
def texturePacks = [
    [title : 'Modernity (vanilla textures, JAPPA style)', prefix: 'Modernity-f1-',
     file  : 'Modernity-f1-3.10.3.1.zip',
     url   : 'https://cdn.modrinth.com/data/rx58ZUPu/versions/zb57cHJj/Modernity-f1-3.10.3.1.zip',
     sha1  : 'd3d5e2ca8de846c6719ae1c2766190b6f2fe133d'],
    [title : 'Modernity Adjunct (mod textures)', prefix: 'ModernityAdjunct-f1-',
     file  : 'ModernityAdjunct-f1-1.7.1.zip',
     url   : 'https://cdn.modrinth.com/data/pS9o7zup/versions/a4L41PU7/ModernityAdjunct-f1-1.7.1.zip',
     sha1  : 'e31296c8346f558ef2a0b858bd97ae9ab46501f6'],
]
def combatPackName = 'ModernCombat-Assets.zip'
def fontPackName = 'ModernFont-Assets.zip'
def installTextures = setting('texturePacks', 'true') != 'false'

def sha1Of = { File f ->
    def digest = java.security.MessageDigest.getInstance('SHA-1')
    f.eachByte(1 << 16) { byte[] buf, int len -> digest.update(buf, 0, len) }
    digest.digest().encodeHex().toString()
}

/**
 * Enables our packs in options.txt in the right priority (1.7.10: the last entry wins) and keeps the
 * player's other packs. Older versions of our packs are dropped from the list.
 */
def syncPackOrder = {
    def options = new File(instanceDir, 'options.txt')
    if (!options.isFile()) {
        logger.lifecycle('  options.txt not found yet: start the game once, then run install again ' +
            '(or enable the packs in Options > Resource Packs)')
        return
    }
    def packsDir = new File(instanceDir, 'resourcepacks')
    def ours = texturePacks.collect { it.file } + [combatPackName, fontPackName]
    def wanted = ours.findAll { new File(packsDir, it).isFile() }
    def lines = options.readLines('UTF-8')
    def i = lines.findIndexOf { it.startsWith('resourcePacks:') }
    def list = i >= 0 ? (new JsonSlurper().parseText(lines[i].substring('resourcePacks:'.length())) as List) : []
    def kept = list.findAll { name -> !ours.contains(name) && !texturePacks.any { name.startsWith(it.prefix) } }
    def result = kept + wanted
    if (result != list) {
        def line = 'resourcePacks:' + JsonOutput.toJson(result)
        if (i >= 0) lines[i] = line else lines << line
        options.write(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
    logger.lifecycle("  resource packs enabled: ${wanted.join(', ')}")
}

tasks.register('installTextures') {
    group = 'infinity reforged'
    description = 'Downloads the Modernity texture packs (modern textures for vanilla and mods) into the instance.'
    onlyIf { installTextures }
    doLast {
        def packsDir = new File(instanceDir, 'resourcepacks')
        packsDir.mkdirs()
        texturePacks.each { pack ->
            def target = new File(packsDir, pack.file)
            (packsDir.listFiles() ?: []).findAll { it.name.startsWith(pack.prefix) && it.name != pack.file }.each {
                it.delete()
                logger.lifecycle("  removed old ${it.name}")
            }
            if (target.isFile() && sha1Of(target) == pack.sha1) {
                logger.lifecycle("  ${pack.title}: up to date")
                return
            }
            logger.lifecycle("  downloading ${pack.title}...")
            def tmp = new File(packsDir, pack.file + '.part')
            tmp.withOutputStream { out -> new URL(pack.url).withInputStream { out << it } }
            if (sha1Of(tmp) != pack.sha1) {
                tmp.delete()
                throw new GradleException("Checksum mismatch for ${pack.file}; try again later.")
            }
            target.delete()
            tmp.renameTo(target)
            logger.lifecycle("  installed ${pack.file}")
        }
        syncPackOrder()
    }
}

// Light shader pack: vanilla look with soft shadows and better lighting (OptiFine 1.7.10 compatible).
def shaderPack = [
    title : "Sildur's Enhanced Default (Fast)", prefix: "Sildur's Enhanced Default ",
    file  : "Sildur's Enhanced Default v1.20 Fast.zip",
    url   : 'https://cdn.modrinth.com/data/2jvH1Rcl/versions/YDBpsjn0/Sildur%27s%20Enhanced%20Default%20v1.20%20Fast.zip',
    sha1  : '382808cf9a52f0300fe08f84c242b2987e8d1859',
]
def installShaders = setting('shaders', 'true') != 'false'

tasks.register('installShaders') {
    group = 'infinity reforged'
    description = "Downloads a light shader pack and selects it in OptiFine (optionsshaders.txt)."
    onlyIf { installShaders }
    doLast {
        def dir = new File(instanceDir, 'shaderpacks')
        dir.mkdirs()
        def target = new File(dir, shaderPack.file)
        (dir.listFiles() ?: []).findAll { it.name.startsWith(shaderPack.prefix) && it.name != shaderPack.file }.each {
            it.delete()
            logger.lifecycle("  removed old ${it.name}")
        }
        if (target.isFile() && sha1Of(target) == shaderPack.sha1) {
            logger.lifecycle("  ${shaderPack.title}: up to date")
        } else {
            logger.lifecycle("  downloading ${shaderPack.title}...")
            def tmp = new File(dir, shaderPack.file + '.part')
            tmp.withOutputStream { out -> new URL(shaderPack.url).withInputStream { out << it } }
            if (sha1Of(tmp) != shaderPack.sha1) {
                tmp.delete()
                throw new GradleException("Checksum mismatch for ${shaderPack.file}; try again later.")
            }
            target.delete()
            tmp.renameTo(target)
            logger.lifecycle("  installed ${shaderPack.file}")
        }

        // Select it in OptiFine unless the player chose another shader pack.
        def options = new File(instanceDir, 'optionsshaders.txt')
        def lines = options.isFile() ? options.readLines('UTF-8') : []
        def i = lines.findIndexOf { it.startsWith('shaderPack=') }
        def current = i >= 0 ? lines[i].substring('shaderPack='.length()) : ''
        if (current in ['', 'OFF', '(internal)'] || current.startsWith(shaderPack.prefix)) {
            def line = "shaderPack=${shaderPack.file}"
            if (i >= 0) lines[i] = line else lines << line
            options.write(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            logger.lifecycle('  selected in OptiFine')
        } else {
            logger.lifecycle("  OptiFine already uses '${current}', left as is")
        }
    }
}

tasks.register('installAssets') {
    group = 'infinity reforged'
    description = 'Builds the Modern Combat sound/sprite pack from your own modern Minecraft install (official launcher or CurseForge).'
    mustRunAfter 'installTextures'
    doLast {
        // Where a modern vanilla Minecraft may be installed: the setting, or the official launcher and CurseForge.
        def roots = minecraftDirSetting ? [file(minecraftDirSetting)]
            : [file(defaultMinecraftDir), file("${home}/curseforge/minecraft/Install")]
        def found = []
        roots.each { root ->
            def versionsDir = new File(root, 'versions')
            (versionsDir.listFiles() ?: []).each { dir ->
                def v = dir.name
                if (v ==~ /[\d.]+/ && new File(dir, "${v}.jar").isFile() && new File(dir, "${v}.json").isFile()
                    && compareVersions(versionKey(v), [1, 20, 2]) >= 0
                    && (!assetsVersion || assetsVersion == v)) {
                    found << [root: root, version: v]
                }
            }
        }
        def pick = found.max { a, b -> compareVersions(versionKey(a.version), versionKey(b.version)) }
        if (!pick) {
            logger.warn("Skipping sound pack: no Minecraft 1.20.2+ found in ${roots.join(' or ')}. " +
                'Launch vanilla 1.21 once (official launcher or CurseForge), or set minecraftDir in local.properties.')
            syncPackOrder()
            return
        }
        File mcDir = pick.root
        String version = pick.version
        def versionsDir = new File(mcDir, 'versions')
        logger.lifecycle("Sound pack from Minecraft ${version} (${mcDir})")

        def slurper = new JsonSlurper()
        def versionJson = slurper.parse(new File(versionsDir, "${version}/${version}.json"))
        def indexFile = new File(mcDir, "assets/indexes/${versionJson.assetIndex.id}.json")
        if (!indexFile.isFile()) {
            logger.warn("Skipping sound pack: ${indexFile} is missing. Launch Minecraft ${version} once.")
            syncPackOrder()
            return
        }
        def index = slurper.parse(indexFile)

        def packs = new File(instanceDir, 'resourcepacks')
        packs.mkdirs()
        def zipFile = new File(packs, combatPackName)

        def soundPrefix = 'minecraft/sounds/entity/player/attack/'
        def sounds = [:].withDefault { [] }
        int textures = 0
        zipFile.withOutputStream { stream ->
            def zip = new ZipOutputStream(stream)
            def put = { String path, byte[] data ->
                zip.putNextEntry(new ZipEntry(path))
                zip.write(data)
                zip.closeEntry()
            }
            put('pack.mcmeta', JsonOutput.prettyPrint(JsonOutput.toJson(
                [pack: [pack_format: 1, description: "Modern Combat: sounds and sprites from Minecraft ${version}"]]))
                .getBytes('UTF-8'))

            index.objects.each { String key, info ->
                if (!key.startsWith(soundPrefix) || !key.endsWith('.ogg')) return
                def name = key.substring(soundPrefix.length())
                def event = name.replaceAll(/\d*\.ogg$/, '')
                def object = new File(mcDir, "assets/objects/${info.hash.substring(0, 2)}/${info.hash}")
                if (!object.isFile()) return
                put("assets/moderncombat/sounds/attack/${name}", object.bytes)
                sounds[event] << "attack/${name - '.ogg'}"
            }
            def soundsJson = sounds.collectEntries { event, files -> ["attack.${event}", [category: 'player', sounds: files.sort()]] }
            put('assets/moderncombat/sounds.json', JsonOutput.prettyPrint(JsonOutput.toJson(soundsJson)).getBytes('UTF-8'))

            def sprites = ['crosshair_attack_indicator_background', 'crosshair_attack_indicator_progress',
                           'crosshair_attack_indicator_full', 'hotbar_attack_indicator_background',
                           'hotbar_attack_indicator_progress'].collect { "textures/gui/sprites/hud/${it}.png" }
            sprites += (0..7).collect { "textures/particle/sweep_${it}.png" }
            new ZipFile(new File(versionsDir, "${version}/${version}.jar")).withCloseable { jar ->
                sprites.each { path ->
                    def entry = jar.getEntry("assets/minecraft/${path}")
                    if (entry) {
                        put("assets/moderncombat/${path}", jar.getInputStream(entry).bytes)
                        textures++
                    }
                }
            }
            zip.finish()
        }
        logger.lifecycle("  ${combatPackName}: ${sounds.size()} sound events, ${textures} textures")

        // Modern Font: the bitmap font definition and its textures (Cyrillic, Greek, accented letters...).
        new ZipFile(new File(versionsDir, "${version}/${version}.jar")).withCloseable { jar ->
            def fontJson = jar.getEntry('assets/minecraft/font/include/default.json') ?: jar.getEntry('assets/minecraft/font/default.json')
            if (!fontJson) {
                logger.warn('  font definition not found in the jar; skipping the font pack')
                return
            }
            def font = slurper.parse(jar.getInputStream(fontJson))
            def providers = font.providers.findAll { it.type == 'bitmap' && !it.file.endsWith('/ascii.png') }
            new File(packs, fontPackName).withOutputStream { stream ->
                def zip = new ZipOutputStream(stream)
                def put = { String path, byte[] data ->
                    zip.putNextEntry(new ZipEntry(path))
                    zip.write(data)
                    zip.closeEntry()
                }
                put('pack.mcmeta', JsonOutput.prettyPrint(JsonOutput.toJson(
                    [pack: [pack_format: 1, description: "Modern Font: glyphs from Minecraft ${version}"]])).getBytes('UTF-8'))
                put('assets/modernfont/font/default.json', JsonOutput.toJson([providers: providers]).getBytes('UTF-8'))
                providers.each { prov ->
                    def name = prov.file.substring(prov.file.lastIndexOf('/') + 1)
                    def entry = jar.getEntry("assets/minecraft/textures/font/${name}")
                    if (entry) put("assets/modernfont/textures/font/${name}", jar.getInputStream(entry).bytes)
                }
                zip.finish()
            }
            logger.lifecycle("  ${fontPackName}: ${providers.size()} glyph sheets")
        }
        syncPackOrder()
    }
}

// Tweaks to other mods' configs. Applied only if the config file exists (the mod was started once).
tasks.register('tweakConfigs') {
    group = 'infinity reforged'
    description = "Adjusts other mods' configs (e.g. hides AppleCore's flickering exhaustion bar)."
    doLast {
        def tweaks = [
            // AppleCore: the exhaustion progress bar behind the hunger bar flickers constantly.
            [file: 'config/AppleCore.cfg', key: 'B:show.food.exhaustion.hud.underlay', value: 'false'],
        ]
        tweaks.each { t ->
            def cfg = new File(instanceDir, t.file)
            if (!cfg.isFile()) return
            def text = cfg.getText('UTF-8')
            def pattern = ~/(?m)^(\s*)${java.util.regex.Pattern.quote(t.key)}=.*$/
            if (!(text =~ pattern).find()) {
                logger.lifecycle("  ${t.file}: ${t.key} not found, skipped")
                return
            }
            def updated = text.replaceAll(pattern) { all, indent -> "${indent}${t.key}=${t.value}" }
            if (updated != text) {
                cfg.write(updated, 'UTF-8')
                logger.lifecycle("  ${t.file}: ${t.key}=${t.value}")
            }
        }
    }
}

tasks.register('install') {
    group = 'infinity reforged'
    description = 'Builds and installs everything into the modpack: mods, texture packs, the sound pack and the shader pack. Close the game first.'
    dependsOn 'installMods', 'installTextures', 'installAssets', 'installShaders', 'tweakConfigs'
}
