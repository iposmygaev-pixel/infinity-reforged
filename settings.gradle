pluginManagement {
    repositories {
        maven {
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup('com.gtnewhorizons')
                includeGroupByRegex('com\\.gtnewhorizons\\..+')
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
    }
}

plugins {
    // Downloads a Java 8 toolchain automatically if none is installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'infinity-reforged'

include 'modern-combat'
include 'modern-font'
